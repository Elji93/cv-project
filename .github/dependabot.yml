version: 2
updates:
  # Paquets npm : une PR groupée par semaine pour les mises à jour mineures et correctives,
  # une PR séparée par paquet pour les mises à jour majeures (plus risquées).
  # Exception : React et ses types vont toujours ensemble (react et react-dom doivent avoir
  # la même version, sinon l'installation échoue).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '06:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps'
    groups:
      # Placé en premier : un paquet va dans le premier groupe qui lui correspond
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      mineures-et-correctifs:
        update-types: [minor, patch]

  # Actions GitHub utilisées dans les workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '06:00'
      timezone: Europe/Paris
    commit-message:
      prefix: 'ci'
    groups:
      actions:
        patterns: ['*']
