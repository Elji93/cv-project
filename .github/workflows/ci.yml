name: CI

# Vérifie chaque Pull Request (agent IA, Dependabot ou manuelle) avant fusion.
# Le job « build-et-tests » sert de contrôle obligatoire dans la protection de main.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-et-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
